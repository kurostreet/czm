import java.time.LocalDateTime
import java.time.Month
import java.time.temporal.ChronoUnit

apply plugin: "com.android.application"

android {
	namespace = "ru.kurostreet.counterzombiemobile"
	ndkVersion = "28.2.13676358"
	compileSdk = 36

	defaultConfig {
		applicationId = "ru.kurostreet.counterzombiemobile"
		versionName = "1.35-" + getGitHash()
		versionCode = getBuildNum()
		minSdk = 21
		targetSdk = 36
		// ABIs are set per flavor: Google Play takes no 32-bit-only x86 (64-bit rule)
	}

	compileOptions {
		sourceCompatibility = JavaVersion.VERSION_11
		targetCompatibility = JavaVersion.VERSION_11
	}

	externalNativeBuild {
		cmake {
			version = "3.22.1"
			path file("../../CMakeLists.txt")
		}
	}

	lint {
		abortOnError = false
	}

	packaging {
		jniLibs {
			keepDebugSymbols.add("**/*.so")
			useLegacyPackaging = true
		}
	}

	signingConfigs {
		debug {
			// Public upstream debug key, for repeatable test updates only.
			storeFile = file("../../3rdparty/xash3d-fwgs/android/debug.keystore")
			storePassword = "android"
			keyAlias = "androiddebugkey"
			keyPassword = "android"
		}

		continuous {
			if (System.getenv('KEYSTORE_FILE_PATH') != null) {
				storeFile = file(System.getenv('KEYSTORE_FILE_PATH'))
				storePassword = System.getenv('KEYSTORE_PASSWORD')
				keyAlias = System.getenv('KEY_ALIAS')
				keyPassword = System.getenv('KEY_PASSWORD')
			}
		}
	}

	buildTypes {
		debug {
			debuggable = true
			applicationIdSuffix = ".test"

			proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.txt"
		}

		release {
			// the Google Play build: no code shrinking, native code reaches Java classes by name (JNI)
			minifyEnabled = false
			shrinkResources = false

			proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.txt"
		}

		create("continuous") {
			initWith(getByName("release"))
			applicationIdSuffix = ".test"
			signingConfig = signingConfigs.continuous

			externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_C_COMPILER_LAUNCHER=ccache", "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
                }
			}
		}
	}

	flavorDimensions += "version"

	productFlavors {
		create("googlePlay") {
			dimension = "version"
			applicationId = "dev.gaming.czm"   // the Google Play listing; the site APK stays ru.kurostreet.counterzombiemobile.test
			buildConfigField("Boolean", "IS_GOOGLE_PLAY_BUILD", "true")
			// Google Play refuses x86 without x86_64; x86_64 devices run the ARM code
			ndk { abiFilters "armeabi-v7a", "arm64-v8a" }
		}

		create("git") {
			dimension = "version"
			buildConfigField("Boolean", "IS_GOOGLE_PLAY_BUILD", "false")
			ndk { abiFilters "armeabi-v7a", "arm64-v8a", "x86" }
		}
	}

	buildFeatures {
		buildConfig = true
	}

	sourceSets {
		main {
			java.srcDirs += ["../../3rdparty/SDL/android-project/app/src/main/java",
				"../../3rdparty/xash3d-fwgs/android/app/src/main/java"]
			jniLibs.srcDirs += ["build/generated/engine/jniLibs"]
			assets.srcDirs += ["build/generated/bundle-assets"]
			if (System.getenv("CZM_GAME_ASSETS_DIR") != null) {
				assets.srcDirs += [System.getenv("CZM_GAME_ASSETS_DIR")]
			}
		}
	}

	androidResources {
		noCompress += ["zip"]
	}

	// only bundles (Google Play) carry the asset pack; APKs from the site keep the data in assets
	assetPacks = [":gamedata"]
}

dependencies {
	// the bell asks Google Play about updates (Google Play build only, see src/googlePlay)
	googlePlayImplementation "com.google.android.play:app-update:2.1.0"
}

def embeddedEngine = tasks.register("buildBundledEngine", Exec) {
	workingDir rootProject.projectDir.parentFile
	commandLine "python3", "scripts/build_android_engine.py",
		"--ndk", new File(android.sdkDirectory, "ndk/" + android.ndkVersion).absolutePath,
		"--output", file("build/generated/engine").absolutePath
	inputs.files(fileTree("../../3rdparty/xash3d-fwgs") {
		exclude "**/.git/**", "**/.lock-*", "**/__pycache__/**"
	})
	inputs.files(fileTree("../../3rdparty/SDL") { exclude "**/.git/**" })
	inputs.files("../../scripts/build_android_engine.py", "../../scripts/create_resource_pack.py",
		"../../scripts/apply_engine_patches.py")
	inputs.files(fileTree("../../patches/xash3d-fwgs"))
	outputs.dir("build/generated/engine/jniLibs")
	outputs.file("build/generated/bundle-assets/bundled/engine-resources.zip")
	outputs.file("build/generated/bundle-assets/bundled/engine-resources.json")
}

tasks.named("preBuild").configure { dependsOn embeddedEngine }

static def getBuildNum() {
	LocalDateTime now = LocalDateTime.now()
	LocalDateTime releaseDate = LocalDateTime.of(2015, Month.OCTOBER, 29, 0, 0, 0)
	int qBuildNum = releaseDate.until(now, ChronoUnit.DAYS)
	int minuteOfDay = now.getHour() * 60 + now.getMinute()
	return qBuildNum * 10000 + minuteOfDay
}

def getGitHash() {
	Process process = new ProcessBuilder("git", "rev-parse", "--short", "HEAD")
			.directory(project.rootDir)
			.redirectErrorStream(true)
			.start()
	InputStreamReader inputStreamReader = new InputStreamReader(process.getInputStream())
	BufferedReader bufferedReader = new BufferedReader(inputStreamReader)

	return bufferedReader.getText().trim()
}

// CMake prepares the bundled game assets. Finish native preparation before
// Gradle snapshots assets, including when building from a clean checkout.
android.applicationVariants.all { variant ->
    def variantTaskName = variant.name.capitalize()
    tasks.matching { it.name == "merge${variantTaskName}Assets" }.configureEach {
        dependsOn "externalNativeBuild${variantTaskName}"
    }
}
