name: CZM Server Tests

on:
  push:
    branches:
      - feature/mobile-launcher
    paths:
      - 'server/czm/**'
      - '.github/workflows/server-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server/czm
    env:
      CZM_PLAY_SERVICE_ACCOUNT_FILE: /nonexistent
      CZM_SMTP_HOST: ''
      CZM_RESEND_API_KEY: ''
      CZM_DATA_DIR: /tmp/czm-test-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/czm/requirements.txt
      - name: Install server test dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify server and lobby tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_*.py' 2>&1 | tee /tmp/server-tests.log
      - name: Show failed tests as annotations
        if: failure()
        shell: bash
        run: |
          # Logs are not always at hand; annotations are readable through the checks API.
          python - <<'PY'
          import re
          text = open("/tmp/server-tests.log", encoding="utf-8", errors="replace").read()
          blocks = re.split(r"\n(?==+\n(?:FAIL|ERROR): )", text)
          failures = [b.strip("=\n") for b in blocks if re.match(r"=*\n?(FAIL|ERROR): ", b.lstrip("\n"))]
          for block in failures[:20] or [text[-3000:]]:
              title = block.splitlines()[0][:200].replace("%", "%25").replace(":", "%3A").replace(",", "%2C")
              body = block[-3500:].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title={title}::{body}")
          PY
