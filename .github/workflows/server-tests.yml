name: CZM Server Tests

on:
  push:
    branches:
      - feature/mobile-launcher
    paths:
      - 'server/czm/**'
      - '.github/workflows/server-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server/czm
    env:
      CZM_PLAY_SERVICE_ACCOUNT_FILE: /nonexistent
      CZM_SMTP_HOST: ''
      CZM_RESEND_API_KEY: ''
      CZM_DATA_DIR: ${{ runner.temp }}/czm-test-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/czm/requirements.txt
      - name: Install server test dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify server and lobby tests
        run: python -m unittest discover -s tests -p 'test_*.py'
