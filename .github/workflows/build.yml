name: Counter Zombie Mobile Android

on:
  push:
    branches: [feature/mobile-launcher]
    # APK builds go only to the authenticated development channel. Play is released manually.
    paths-ignore: ['server/**', '.github/**', '**/*.md', 'czm/whatsnew.txt', 'android/gamedata/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # the game server checks this token before it takes a new build

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build integrated Android test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout pinned sources and dependencies
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Check archive extraction
        run: |
          javac --release 11 -d /tmp/czm-java-check android/app/src/main/java/ru/kurostreet/counterzombiemobile/ArchiveExtractor.java tests/ArchiveExtractorTest.java
          java -cp /tmp/czm-java-check ArchiveExtractorTest
      - name: Check server credential isolation and encrypted storage
        run: |
          javac --release 11 -d /tmp/czm-auth-check android/app/src/git/java/ru/kurostreet/counterzombiemobile/DevelopmentInvite.java tests/DevelopmentInviteTest.java
          java -cp /tmp/czm-auth-check ru.kurostreet.counterzombiemobile.DevelopmentInviteTest
          javac --release 11 -d /tmp/czm-auth-check android/app/src/main/java/ru/kurostreet/counterzombiemobile/ServerAuthData.java tests/ServerAuthDataTest.java
          java -cp /tmp/czm-auth-check ru.kurostreet.counterzombiemobile.ServerAuthDataTest
          javac --release 11 -d /tmp/czm-auth-check android/app/src/main/java/ru/kurostreet/counterzombiemobile/ColorWheelData.java tests/ColorWheelDataTest.java
          java -cp /tmp/czm-auth-check ru.kurostreet.counterzombiemobile.ColorWheelDataTest
      - name: Check APK patch generation, download and fallback
        run: |
          curl -fsSL --retry 3 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o /tmp/czm-json.jar
          echo '3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed  /tmp/czm-json.jar' | sha256sum -c -
          javac --release 11 -cp /tmp/czm-json.jar -d /tmp/czm-java-check android/app/src/git/java/ru/kurostreet/counterzombiemobile/ApkUpdate.java tests/ApkUpdateTest.java
          CZM_JAVA_CLASSES=/tmp/czm-java-check CZM_JSON_JAR=/tmp/czm-json.jar python3 -m unittest discover -s tests -p test_apk_update.py -v
          CZM_JSON_JAR=/tmp/czm-json.jar python3 -m unittest discover -s tests -p test_account_client.py -v
          CZM_JSON_JAR=/tmp/czm-json.jar python3 -m unittest discover -s tests -p test_settings_data.py -v
          python3 -m venv /tmp/czm-server-check
          /tmp/czm-server-check/bin/pip install -q -r server/czm/requirements.txt
          PYTHONPATH=server/czm /tmp/czm-server-check/bin/python -m unittest discover -s server/czm/tests -v
      - name: Apply engine patches
        run: |
          python3 -m unittest discover -s tests -p test_engine_patches.py -v
          python3 scripts/apply_engine_patches.py
          python3 -m unittest discover -s tests -p test_goldsrc_entities.py -v
      - name: Check native home and lobby geometry, actions and role controls
        run: |
          python3 -m unittest discover -s tests -p test_home_actions.py -v
          python3 -m unittest discover -s tests -p test_lobby_menu.py -v
          python3 -m unittest discover -s tests -p test_server_browser.py -v
          python3 -m unittest discover -s tests -p test_lobby_voice_client.py -v
          python3 -m unittest discover -s tests -p test_lobby_audio.py -v
      - name: Check shared map capture state and read-only protection
        run: |
          python3 -m unittest discover -s tests -p test_map_capture.py -v
          python3 -m unittest discover -s tests -p test_avatar_restore.py -v
          python3 -m unittest discover -s tests -p test_scoreboard_styles.py -v
          python3 -m unittest discover -s tests -p test_tab_avatars.py -v
          python3 -m unittest discover -s tests -p test_social_menu.py -v
          python3 -m unittest discover -s tests -p test_rules_window.py -v
          python3 -m unittest discover -s tests -p test_moderation_window.py -v
          python3 -m unittest discover -s tests -p test_top_window.py -v
          python3 -m unittest discover -s tests -p test_hud_letters.py -v
          python3 -m unittest discover -s tests -p test_news_language.py -v
          python3 -m unittest discover -s tests -p test_loading_errors.py -v
          python3 -m unittest discover -s tests -p test_connection_notices.py -v
          python3 -m unittest discover -s tests -p test_background_downloads.py -v
          /tmp/czm-server-check/bin/python -m unittest discover -s tests -p test_sprays.py -v
          python3 -m unittest discover -s tests -p test_touch_editor.py -v
          python3 -m unittest discover -s tests -p test_game_hud.py -v
          python3 -m unittest discover -s tests -p test_settings_apply.py -v
          python3 -m unittest discover -s tests -p test_settings_rows.py -v
          python3 -m unittest discover -s tests -p test_spectator_overlay.py -v
          python3 -m unittest discover -s tests -p test_default_layout.py -v
      - name: Build engine and client from source
        working-directory: android
        run: ./gradlew --no-daemon assembleGitDebug
      - name: Verify application, integrated libraries and signature
        env:
          APK_PATH: android/app/build/outputs/apk/git/debug/app-git-debug.apk
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK_PATH" > apk-info.txt
          grep -F "package: name='ru.kurostreet.counterzombiemobile.test'" apk-info.txt
          grep -F "application-label:'Counter Zombie Mobile 32 players'" apk-info.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK_PATH"
          python - <<'PY'
          import os, json, hashlib, io, wave, array
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile(os.environ["APK_PATH"]) as apk:
              for name in ["gfx/vgui/czm_logo.tga", "gfx/shell/strings.lst", "touch/buy.cfg",
                           "gfx/czm/menu_bg.png", "gfx/czm/title.png", "gfx/czm/fade_left.png", "gfx/czm/fade_bottom.png", "gfx/czm/hud_glyphs.tga",
                           "gfx/czm/menu_environment.png", "gfx/czm/menu_ct.png", "gfx/czm/menu_zombies.png",
                           "gfx/czm/loading_1.png", "gfx/czm/loading_5.png", "media/czm_sound.mp3", "media/czm_music_silent.mp3", "media/czm_music_city.mp3", "media/czm_music_thoughts.mp3",
                           "sound/czm/tapscroll.wav", "gfx/fonts/czm/InterDisplay-Black.otf",
                           "gfx/fonts/czm/Inter-SemiBold.otf", "gfx/fonts/czm/Inter-Medium.otf",
                           "gfx/fonts/czm/InterDisplay-BlackItalic.otf", "gfx/czm/ui/tile_attack.png",
                           "gfx/czm/ui/tile_escape.png", "gfx/czm/ui/tile_boss.png", "gfx/czm/ui/panel.png",
                           "gfx/czm/ui/dot.png", "gfx/czm/ui/color_wheel.png", "gfx/czm/ui/avatar.png", "gfx/czm/ui/tab_on.png",
                           "logos/czm_logo.png", "logos/czm_zm.png", "gfx/czm/touch/fire.png",
                           "gfx/czm/touch/jump.png", "gfx/czm/touch/ddrun.png",
                           "gfx/czm/shop/wheel1.png", "gfx/czm/shop/wheel6.png", "gfx/czm/shop/wheel8_7.png", "gfx/czm/ui/editor_bg.png", "touch_presets/czm_scheme1.cfg",
                           "touch_presets/czm_scheme2.cfg", "touch_presets/czm_scheme3.cfg",
                           "userconfig.d/czm_touch.cfg", "gfx/czm/ui/icon_globe.png", "gfx/czm/ui/icon_star_on.png",
                           "gfx/czm/ui/white.png", "gfx/czm/ui/surface.png", "gfx/czm/ui/icon_crown.png", "gfx/czm/maps/_zombie.png", "gfx/czm/maps/_classic.png",
                           "gfx/czm/maps/zm_3rooms.png", "gfx/czm/avatars/avatar_01.png", "gfx/czm/avatars/avatar_10.png",
                           "gfx/czm/radar/radar_classic.png", "gfx/czm/radar/radar_tactical.png", "gfx/czm/radar/mark_dot.png"]:
                  assert apk.read("assets/" + name) == Path("3rdparty/cs16client-extras", name).read_bytes(), name
              with wave.open(io.BytesIO(apk.read("assets/sound/czm/tapscroll.wav"))) as tap:
                  assert (tap.getnchannels(), tap.getsampwidth(), tap.getframerate(), tap.getcomptype()) == (1, 2, 44100, "NONE")
                  assert 0.05 < tap.getnframes() / tap.getframerate() < 1.0
                  assert max(abs(v) for v in array.array("h", tap.readframes(tap.getnframes()))) > 1000
              for abi, suffix in [("arm64-v8a", "arm64"), ("armeabi-v7a", "armv7l"), ("x86", "i386")]:
                  for library in ["SDL2", "xash", "filesystem_stdio", "ref_gles1", "ref_gl4es", "ref_gles3compat",
                                  "client_android_" + suffix, "cs_android_" + suffix,
                                  "menu_android_" + suffix, "yapb_android_" + suffix]:
                      assert "lib/" + abi + "/lib" + library + ".so" in apk.namelist(), (abi, library)
                  menu = apk.read("lib/" + abi + "/libmenu_android_" + suffix + ".so")
                  assert b"Counter Zombie Mobile 32 players build %s" in menu
                  assert b"cs16-client build %s" not in menu
                  assert b"czm_loading_session" in menu and b"gfx/czm/loading_%d.png" in menu, abi
                  assert b"menu_czmmain" in menu and b"czm_queryserver" in menu, abi
                  assert b"menu_czmsettings" in menu and b"czm_zoom_sens" in menu, abi
                  assert b"menu_czmtouch" in menu and b"czm_touch_scheme" in menu, abi
                  assert b"menu_czmshop" in menu and b"czm_menu_cards" in menu and b"czm_shop_auto" in menu, abi
                  assert b"menu_czmservers" in menu and b"czm_srv_filters" in menu and b"favorite_servers.lst" in menu, abi
                  assert b"czmavatar://pick?file=%s" in menu and b"czm_avatar_photo" in menu, abi
                  assert b"menu_czmchat" in menu and b"/api/v1/hello" in menu and b"ru/kurostreet/counterzombiemobile/CzmNet" in menu, abi
                  assert b"czm/tapscroll.wav" in menu and b"https://counter-zombie.ru%s" in menu, abi
                  assert b"serverAuthShow" in menu and b"accountShow" in menu and b"accountEvent" in menu, abi
                  assert b"accountRegister" in menu and b"accountContext" in menu and b"setup_register" in menu, abi
                  assert b"colorShow" in menu and b"colorEvent" in menu and b"czm_tab_style" in menu, abi
                  assert b"/api/v1/tab/bind" in menu and b"/api/v1/tab/resolve" in menu, abi
                  engine = apk.read("lib/" + abi + "/libxash.so")
                  assert b"serverUserinfo" in engine, abi
                  assert b"czm_loading_enable" in engine and b"czm_loading_error" in engine, abi
                  assert b"czm_queryserver" in engine and b"czm_mictest" in engine, abi
                  assert b"czm_tab_state" in engine and b"czm_tag" in engine, abi
                  client = apk.read("lib/" + abi + "/libclient_android_" + suffix + ".so")
                  assert b"czm_autorun" in client and b"czm_buy_state" in client and b"czm_menu" in client, abi
                  assert b"czm_tab_style" in client, abi
                  assert b"czm_tab/%s" in client and b"czm_tab_avatar_%d" in client, abi
              for name in ["engine-resources", "client-resources"]:
                  metadata = json.loads(apk.read("assets/bundled/" + name + ".json"))
                  assert hashlib.sha256(apk.read("assets/bundled/" + name + ".zip")).hexdigest() == metadata["sha256"]
          print("Engine, client and resource bundles verified for all three ABIs")
          PY
          cp "$APK_PATH" CounterZombieMobile-Core-test.apk
          sha256sum CounterZombieMobile-Core-test.apk > CounterZombieMobile-Core-test.apk.sha256
          mkdir -p tools
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" tools/
      - name: Explain that the core APK cannot start the game
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile("CounterZombieMobile-Core-test.apk") as apk:
              # Full game-data is intentionally kept on the authorized
              # packaging server, never pushed into GitHub artifacts.
              assert "assets/bundled/game-data.zip" not in apk.namelist()
              assert "assets/bundled/game-data.json" not in apk.namelist()
          PY
          cat > CORE-NOT-INSTALLABLE.txt <<'TEXT'
          IMPORTANT: THIS IS NOT AN INSTALLABLE GAME!
          CounterZombieMobile-Core-test.apk is a technical intermediate built
          by CI. It intentionally does NOT contain bundled/game-data.zip and
          bundled/game-data.json. Installing it shows the "missing game files"
          error. Do not distribute this APK to players or testers.
          A full CZM test APK must be assembled separately, using the private
          existing game-data archive, then signed and verified.

          ВНИМАНИЕ: ЭТО НЕ ПОЛНАЯ ИГРА!
          Core-test.apk не содержит игровые файлы game-data.zip / .json.
          Не устанавливайте и не распространяйте этот файл.
          Используйте только полностью собранный, подписанный FULL APK.
          TEXT
      - name: Upload non-installable core only (for private full-APK assembly)
        uses: actions/upload-artifact@v4
        with:
          name: CZM-CORE-NOT-AN-INSTALLABLE-APK
          path: |
            CORE-NOT-INSTALLABLE.txt
            CounterZombieMobile-Core-test.apk
            CounterZombieMobile-Core-test.apk.sha256
            apk-info.txt
            tools/apksigner.jar
          if-no-files-found: error
          retention-days: 30
      - name: Send the build to the game server
        # the server adds the game data, signs the APK and gives it to the players at once
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feature/mobile-launcher'
        run: |
          set -euo pipefail
          VERSION=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" apk-info.txt | head -n1)
          CODE=$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" apk-info.txt | head -n1)
          SHA256=$(cut -d' ' -f1 CounterZombieMobile-Core-test.apk.sha256)
          NOTES=$( [ -f czm/whatsnew.txt ] && base64 -w0 czm/whatsnew.txt || true )
          # until the server has the builds endpoint it answers 404: nothing to send yet
          if [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST https://kontrafps.ru/api/v1/builds || true)" = 404 ]; then
            echo "::notice::The game server does not take builds yet, skipped"
            exit 0
          fi
          echo "Sending $VERSION ($CODE), $(du -m CounterZombieMobile-Core-test.apk | cut -f1) MB"
          for attempt in 1 2 3 4; do
            # a fresh token for every attempt, they live only a few minutes
            TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=kontrafps.ru" | python3 -c 'import json, sys; print(json.load(sys.stdin)["value"])')
            echo "::add-mask::$TOKEN"
            if curl -sS --fail-with-body --max-time 1200 -X POST -H "Expect:" \
                -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/vnd.android.package-archive" \
                -H "X-CZM-Notes: $NOTES" -T CounterZombieMobile-Core-test.apk \
                "https://kontrafps.ru/api/v1/builds?version=$VERSION&code=$CODE&sha256=$SHA256&commit=$GITHUB_SHA"; then
              echo
              exit 0
            fi
            echo
            echo "attempt $attempt failed"
            sleep 30
          done
          exit 1
