// Counter Zombie Mobile touch buttons
// auto run (czm_autorun) is a client command, see cl_dll/input/input_xash3d.cpp

// jump and crouch together
alias +czm_duckjump "+jump; +duck"
alias -czm_duckjump "-jump; -duck"

// one short crouch, like one step of the mouse wheel; the swipe button repeats it (double duck)
alias czm_dd "+duck 251; -duck 251"

// "More" shows and hides the rare buttons
alias czm_more "czm_more_show"
alias czm_more_show "touch_show more_*; alias czm_more czm_more_hide"
alias czm_more_hide "touch_hide more_*; alias czm_more czm_more_show"
